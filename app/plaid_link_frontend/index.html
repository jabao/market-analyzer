<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background: transparent;
    }

    .wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 48px;
    }

    button {
      border: 0;
      border-radius: 8px;
      background: #0f172a;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      line-height: 1;
      min-height: 44px;
      padding: 0 18px;
      white-space: nowrap;
    }

    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    #status {
      color: #475569;
      font-size: 13px;
      line-height: 1.35;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <button id="open-link" type="button" disabled>Connect Robinhood</button>
    <span id="status">Preparing Plaid Link...</span>
  </div>

  <script>
    let handler = null;
    let activeToken = null;
    let latestArgs = {};
    let autoOpenedLaunchId = null;
    let pendingPopup = null;
    let pendingPopupId = null;
    let loadedPopupId = null;
    const popupChannels = {};
    const popupPollers = {};

    const button = document.getElementById("open-link");
    const status = document.getElementById("status");

    function send(type, payload) {
      window.parent.postMessage(
        Object.assign({ isStreamlitMessage: true, type: type }, payload || {}),
        "*"
      );
    }

    function setFrameHeight() {
      send("streamlit:setFrameHeight", {
        height: document.documentElement.scrollHeight || 64
      });
    }

    function setComponentValue(value) {
      send("streamlit:setComponentValue", {
        value: value,
        dataType: "json"
      });
    }

    function popupChannelName(popupId) {
      return "market-analyzer-plaid-" + popupId;
    }

    function tokenStorageKey(popupId) {
      return "market-analyzer-plaid-token-" + popupId;
    }

    function resultStorageKey(popupId) {
      return "market-analyzer-plaid-result-" + popupId;
    }

    function writeLocalStorage(key, value) {
      try {
        window.localStorage.setItem(key, JSON.stringify(value));
      } catch (error) {
        return false;
      }
      return true;
    }

    function readLocalStorage(key) {
      try {
        const raw = window.localStorage.getItem(key);
        return raw ? JSON.parse(raw) : null;
      } catch (error) {
        return null;
      }
    }

    function handlePopupPayload(payload) {
      if (!payload) {
        return;
      }

      if (payload.event === "success") {
        status.textContent = "Connection approved. Importing holdings...";
        button.disabled = true;
      } else if (payload.event === "exit") {
        status.textContent = payload.error ? "Plaid Link exited with an error." : "Plaid Link closed.";
      } else if (payload.event === "open_failed") {
        status.textContent = "Plaid Link could not open in the popup.";
      }
      setComponentValue(payload);
    }

    function popupChannel(popupId) {
      if (!popupId || !("BroadcastChannel" in window)) {
        return null;
      }

      if (popupChannels[popupId]) {
        return popupChannels[popupId];
      }

      const channel = new BroadcastChannel(popupChannelName(popupId));
      channel.onmessage = function(event) {
        const data = event.data || {};
        if (data.type === "result") {
          handlePopupPayload(data.payload || {});
        } else if (data.type === "popup_ready") {
          sendLinkTokenToPopup(popupId);
        }
      };
      popupChannels[popupId] = channel;
      return channel;
    }

    function startResultPolling(popupId) {
      if (!popupId || popupPollers[popupId]) {
        return;
      }

      popupPollers[popupId] = setInterval(function() {
        const payload = readLocalStorage(resultStorageKey(popupId));
        if (!payload) {
          return;
        }
        try {
          window.localStorage.removeItem(resultStorageKey(popupId));
        } catch (error) {
          // Ignore cleanup failures; duplicate public tokens are filtered in Python.
        }
        clearInterval(popupPollers[popupId]);
        popupPollers[popupId] = null;
        handlePopupPayload(payload);
      }, 300);
    }

    function sendLinkTokenToPopup(popupId) {
      if (!popupId || !latestArgs.linkToken) {
        return;
      }

      const channel = popupChannel(popupId);
      if (channel) {
        channel.postMessage({
          type: "link_token",
          linkToken: latestArgs.linkToken
        });
      } else if (pendingPopup && !pendingPopup.closed) {
        pendingPopup.postMessage({
          source: "market-analyzer-plaid-parent",
          type: "link_token",
          linkToken: latestArgs.linkToken
        }, "*");
      }
      writeLocalStorage(tokenStorageKey(popupId), {
        linkToken: latestArgs.linkToken,
        sentAt: Date.now()
      });
      status.textContent = "Robinhood login opened in a separate window.";
    }

    function startTokenBroadcast(popupId) {
      if (!popupId || !latestArgs.linkToken) {
        return;
      }

      popupChannel(popupId);
      startResultPolling(popupId);
      [0, 250, 1000, 2500, 5000].forEach(function(delay) {
        setTimeout(function() {
          sendLinkTokenToPopup(popupId);
        }, delay);
      });
    }

    function plaidReady() {
      return typeof window.Plaid !== "undefined" && window.Plaid && latestArgs.linkToken;
    }

    function buildHandler(linkToken) {
      if (!plaidReady()) {
        button.disabled = true;
        status.textContent = "Plaid Link is still loading...";
        return;
      }

      if (handler && activeToken === linkToken) {
        button.disabled = false;
        maybeAutoOpen();
        return;
      }

      activeToken = linkToken;
      handler = window.Plaid.create({
        token: linkToken,
        onSuccess: function(publicToken, metadata) {
          status.textContent = "Connection approved. Importing holdings...";
          button.disabled = true;
          setComponentValue({
            event: "success",
            public_token: publicToken,
            metadata: metadata || {}
          });
        },
        onExit: function(error, metadata) {
          status.textContent = error ? "Plaid Link exited with an error." : "Plaid Link closed.";
          setComponentValue({
            event: "exit",
            error: error || null,
            metadata: metadata || {}
          });
        }
      });
      button.disabled = false;
      status.textContent = "Ready to connect.";
      maybeAutoOpen();
    }

    function popupDocument() {
      const linkToken = JSON.stringify(latestArgs.linkToken || "");
      const title = JSON.stringify("Connect Robinhood");
      return `<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Connect Robinhood</title>
  <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"><\/script>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      height: 100vh;
      justify-content: center;
      margin: 0;
    }
    main {
      max-width: 360px;
      padding: 24px;
      text-align: center;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 10px;
    }
    p {
      color: #475569;
      font-size: 14px;
      line-height: 1.45;
      margin: 0;
    }
    button {
      border: 0;
      border-radius: 8px;
      background: #0f172a;
      color: #fff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      margin-top: 18px;
      min-height: 42px;
      padding: 0 16px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Connect Robinhood</h1>
    <p id="message">Opening Plaid Link...</p>
    <button id="retry" type="button" style="display:none;">Open Plaid Link</button>
  </main>
  <script>
    const linkToken = ${linkToken};
    const title = ${title};
    const message = document.getElementById("message");
    const retry = document.getElementById("retry");

    function send(payload) {
      if (window.opener) {
        window.opener.postMessage({
          source: "market-analyzer-plaid-popup",
          payload: payload
        }, "*");
      }
    }

    function showRetry(text) {
      message.textContent = text || "Plaid Link did not open automatically.";
      retry.style.display = "inline-block";
    }

    function openPlaid() {
      if (!window.Plaid) {
        showRetry("Plaid Link is still loading.");
        return;
      }

      retry.style.display = "none";
      message.textContent = "Opening Plaid Link...";
      try {
        const handler = window.Plaid.create({
          token: linkToken,
          onSuccess: function(publicToken, metadata) {
            message.textContent = "Connection approved. Returning to Market Analyzer...";
            send({
              event: "success",
              public_token: publicToken,
              metadata: metadata || {}
            });
            setTimeout(function() { window.close(); }, 500);
          },
          onExit: function(error, metadata) {
            message.textContent = error ? "Plaid Link exited with an error." : "Plaid Link closed.";
            send({
              event: "exit",
              error: error || null,
              metadata: metadata || {}
            });
            setTimeout(function() { window.close(); }, 700);
          }
        });
        handler.open();
      } catch (error) {
        send({
          event: "open_failed",
          error: {
            message: error && error.message ? error.message : String(error)
          }
        });
        showRetry("Plaid Link could not open.");
      }
    }

    retry.addEventListener("click", openPlaid);
    window.addEventListener("load", function() {
      document.title = title;
      setTimeout(openPlaid, 100);
    });
  <\/script>
</body>
</html>`;
    }

    function popupFeatures() {
      const width = 480;
      const height = 720;
      const left = Math.max(0, Math.round(window.screenX + (window.outerWidth - width) / 2));
      const top = Math.max(0, Math.round(window.screenY + (window.outerHeight - height) / 2));
      return [
        "popup=yes",
        "width=" + width,
        "height=" + height,
        "left=" + left,
        "top=" + top,
        "resizable=yes",
        "scrollbars=yes"
      ].join(",");
    }

    function placeholderDocument(popupId) {
      const channelName = JSON.stringify(popupChannelName(popupId || ""));
      const tokenKey = JSON.stringify(tokenStorageKey(popupId || ""));
      const resultKey = JSON.stringify(resultStorageKey(popupId || ""));
      return `<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Preparing Robinhood Login</title>
  <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"><\/script>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      height: 100vh;
      justify-content: center;
      margin: 0;
    }
    main {
      max-width: 360px;
      padding: 24px;
      text-align: center;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 10px;
    }
    p {
      color: #475569;
      font-size: 14px;
      line-height: 1.45;
      margin: 0;
    }
  </style>
</head>
<body>
  <main>
    <h1>Preparing Robinhood Login</h1>
    <p id="message">Keep this window open while Market Analyzer prepares Plaid Link.</p>
    <button id="retry" type="button" style="display:none;">Open Plaid Link</button>
  </main>
  <script>
    const channelName = ${channelName};
    const tokenKey = ${tokenKey};
    const resultKey = ${resultKey};
    const message = document.getElementById("message");
    const retry = document.getElementById("retry");
    const channel = "BroadcastChannel" in window && channelName ? new BroadcastChannel(channelName) : null;
    let linkToken = "";
    let opened = false;
    let readyInterval = null;
    let tokenPoller = null;

    function writeLocalStorage(key, value) {
      try {
        window.localStorage.setItem(key, JSON.stringify(value));
      } catch (error) {
        return false;
      }
      return true;
    }

    function readLocalStorage(key) {
      try {
        const raw = window.localStorage.getItem(key);
        return raw ? JSON.parse(raw) : null;
      } catch (error) {
        return null;
      }
    }

    function sendPayload(payload) {
      if (channel) {
        channel.postMessage({ type: "result", payload: payload });
      }
      if (resultKey) {
        writeLocalStorage(resultKey, payload);
      }
      if (window.opener) {
        window.opener.postMessage({
          source: "market-analyzer-plaid-popup",
          payload: payload
        }, "*");
      }
    }

    function announceReady() {
      if (channel) {
        channel.postMessage({ type: "popup_ready" });
      }
    }

    function pollToken() {
      const stored = readLocalStorage(tokenKey);
      if (stored && stored.linkToken) {
        receiveToken(stored.linkToken);
      }
    }

    function showRetry(text) {
      message.textContent = text || "Plaid Link did not open automatically.";
      retry.style.display = "inline-block";
    }

    function openPlaid() {
      if (!linkToken) {
        announceReady();
        showRetry("Waiting for Market Analyzer to finish preparing Plaid Link.");
        return;
      }

      if (!window.Plaid) {
        showRetry("Plaid Link is still loading.");
        return;
      }

      if (opened) {
        return;
      }

      opened = true;
      retry.style.display = "none";
      message.textContent = "Opening Plaid Link...";
      try {
        const handler = window.Plaid.create({
          token: linkToken,
          onSuccess: function(publicToken, metadata) {
            message.textContent = "Connection approved. Returning to Market Analyzer...";
            sendPayload({
              event: "success",
              public_token: publicToken,
              metadata: metadata || {}
            });
            setTimeout(function() { window.close(); }, 700);
          },
          onExit: function(error, metadata) {
            message.textContent = error ? "Plaid Link exited with an error." : "Plaid Link closed.";
            sendPayload({
              event: "exit",
              error: error || null,
              metadata: metadata || {}
            });
            setTimeout(function() { window.close(); }, 900);
          }
        });
        handler.open();
      } catch (error) {
        opened = false;
        sendPayload({
          event: "open_failed",
          error: {
            message: error && error.message ? error.message : String(error)
          }
        });
        showRetry("Plaid Link could not open.");
      }
    }

    function receiveToken(token) {
      if (!token) {
        return;
      }
      linkToken = token;
      if (readyInterval) {
        clearInterval(readyInterval);
        readyInterval = null;
      }
      if (tokenPoller) {
        clearInterval(tokenPoller);
        tokenPoller = null;
      }
      openPlaid();
    }

    retry.addEventListener("click", openPlaid);
    if (channel) {
      channel.onmessage = function(event) {
        const data = event.data || {};
        if (data.type === "link_token") {
          receiveToken(data.linkToken);
        }
      };
    }
    window.addEventListener("message", function(event) {
      const data = event.data || {};
      if (data.source === "market-analyzer-plaid-parent" && data.type === "link_token") {
        receiveToken(data.linkToken);
      }
    });
    window.addEventListener("load", function() {
      announceReady();
      readyInterval = setInterval(announceReady, 500);
      tokenPoller = setInterval(pollToken, 300);
      pollToken();
      setTimeout(function() {
        if (!linkToken) {
          showRetry("Waiting for Market Analyzer to finish preparing Plaid Link.");
        }
      }, 1500);
    });
  <\/script>
</body>
</html>`;
    }

    function writePopupDocument(popup, html) {
      popup.document.open();
      popup.document.write(html);
      popup.document.close();
      popup.focus();
    }

    function openPreparePopup() {
      pendingPopupId = "plaid-popup-" + Date.now() + "-" + Math.random().toString(16).slice(2);
      pendingPopup = window.open("", "market_analyzer_robinhood_login", popupFeatures());
      if (!pendingPopup) {
        pendingPopupId = null;
        status.textContent = "The browser blocked the popup. Allow popups and try again.";
        setComponentValue({
          event: "open_failed",
          error: { message: "Popup was blocked by the browser." }
        });
        return;
      }

      popupChannel(pendingPopupId);
      startResultPolling(pendingPopupId);
      writePopupDocument(pendingPopup, placeholderDocument(pendingPopupId));
      status.textContent = "Preparing login in a separate window...";
      setComponentValue({
        event: "prepare_requested",
        popup_id: pendingPopupId
      });
    }

    function openPlaidPopup(existingPopup) {
      if (!latestArgs.linkToken) {
        if (latestArgs.prepareMode) {
          openPreparePopup();
        } else {
          status.textContent = "Create a Plaid link token first.";
        }
        return;
      }

      const popupId = latestArgs.popupId || pendingPopupId || ("plaid-popup-" + Date.now() + "-" + Math.random().toString(16).slice(2));
      const popup = existingPopup || window.open("", "market_analyzer_robinhood_login", popupFeatures());
      if (!popup) {
        status.textContent = "The browser blocked the popup. Allow popups and try again.";
        setComponentValue({
          event: "open_failed",
          error: { message: "Popup was blocked by the browser." }
        });
        return;
      }

      pendingPopup = popup;
      pendingPopupId = popupId;
      popupChannel(popupId);
      startResultPolling(popupId);
      writePopupDocument(popup, placeholderDocument(popupId));
      startTokenBroadcast(popupId);
    }

    function loadPendingPopupIfReady() {
      const popupId = latestArgs.popupId || pendingPopupId;
      if (!latestArgs.linkToken || !popupId) {
        return;
      }

      if (loadedPopupId !== popupId) {
        loadedPopupId = popupId;
      }
      startTokenBroadcast(popupId);
    }

    function openPlaidLink() {
      if (latestArgs.popupMode !== false) {
        openPlaidPopup();
        return;
      }

      if (!handler) {
        buildHandler(latestArgs.linkToken);
      }
      if (handler) {
        status.textContent = "Opening Plaid Link...";
        handler.open();
      }
    }

    function maybeAutoOpen() {
      if (!latestArgs.autoOpen) {
        return;
      }

      const launchId = latestArgs.launchId || latestArgs.linkToken;
      if (autoOpenedLaunchId === launchId) {
        return;
      }

      autoOpenedLaunchId = launchId;
      setTimeout(function() {
        try {
          openPlaidLink();
        } catch (error) {
          status.textContent = "Click Connect Robinhood to continue.";
          button.disabled = false;
          setComponentValue({
            event: "open_failed",
            error: {
              message: error && error.message ? error.message : String(error)
            }
          });
        }
      }, 0);
    }

    function render(args) {
      latestArgs = args || {};
      button.textContent = latestArgs.buttonLabel || "Connect Robinhood";
      if (!latestArgs.linkToken) {
        button.disabled = !latestArgs.prepareMode;
        status.textContent = latestArgs.prepareMode
          ? "Ready to open a separate login window."
          : "Create a Plaid link token first.";
      } else if (latestArgs.popupMode !== false) {
        button.disabled = false;
        status.textContent = "Ready to open a separate login window.";
        loadPendingPopupIfReady();
        maybeAutoOpen();
      } else {
        buildHandler(latestArgs.linkToken);
      }
      setFrameHeight();
    }

    button.addEventListener("click", function() {
      openPlaidLink();
    });

    window.addEventListener("message", function(event) {
      const data = event.data || {};
      if (data.type === "streamlit:render") {
        render(data.args || {});
      } else if (data.source === "market-analyzer-plaid-popup") {
        handlePopupPayload(data.payload || {});
      }
    });

    window.addEventListener("load", function() {
      if (latestArgs.linkToken && latestArgs.popupMode === false) {
        buildHandler(latestArgs.linkToken);
      }
      setFrameHeight();
    });

    send("streamlit:componentReady", { apiVersion: 1 });
    setFrameHeight();
  </script>
</body>
</html>
